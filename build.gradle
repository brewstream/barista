plugins {
    id 'com.vanniktech.maven.publish' version '0.30.0' apply false
}

ext {
    nettyVersion = '4.2.17.Final'
    springBootVersion = '4.1.1'
    roastVersion = '0.1.3'
    pressVersion = '0.1.0'
    grindVersion = '0.3.0'
}

subprojects {
    apply plugin: 'java-library'

    // io.github.brewstream for the same reason as Roast and Press: Central verifies the
    // group against the GitHub org; the Java packages stay org.brewstream.barista.
    group = findProperty('publishGroup') ?: 'io.github.brewstream'
    version = findProperty('version') != 'unspecified' ? findProperty('version') : '0.1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.assertj:assertj-core:3.27.7'
        testImplementation 'org.mockito:mockito-core:5.23.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    }

    javadoc {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    test {
        useJUnitPlatform {
            excludeTags 'interop'
        }
    }

    tasks.register('interopTest', Test) {
        description = 'Runs interop tests against real peers (ffmpeg, srt-live-transmit). Skips itself when absent.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'interop'
        }
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }
}

// Both modules publish to Maven Central as io.github.brewstream:<module name>,
// with the same POM apart from the name. The tag is the version (release.yml).
def displayNames = ['barista-core': 'Barista Core', 'barista-spring-boot-starter': 'Barista Spring Boot Starter']

subprojects {
    apply plugin: 'com.vanniktech.maven.publish'

    mavenPublishing {
        publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
        if (project.findProperty('signing.gnupg.keyName') || project.findProperty('signingInMemoryKey')) {
            signAllPublications()
        }

        coordinates(project.group.toString(), project.name, project.version.toString())

        pom {
            name = displayNames[project.name]
            description = project.description
            url = 'https://github.com/brewstream/barista'
            inceptionYear = '2026'

            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'viniciusccarvalho'
                    name = 'Vinicius Carvalho'
                    url = 'https://github.com/viniciusccarvalho'
                }
            }

            scm {
                connection = 'scm:git:git://github.com/brewstream/barista.git'
                developerConnection = 'scm:git:ssh://github.com:brewstream/barista.git'
                url = 'https://github.com/brewstream/barista'
            }
        }
    }
}

// One check over every module's sources, run once from the root.
tasks.register('licenseCheck', Exec) {
    description = 'Fails if any Java source is missing the Apache 2.0 header.'
    group = 'verification'
    commandLine "${rootDir}/scripts/license-header.sh", '--check'
}
subprojects {
    tasks.matching { it.name == 'check' }.configureEach { dependsOn rootProject.tasks.named('licenseCheck') }
}
